description: >
  Cross-boundary subgraph layout under elk — two subgraphs (Frontend,
  Backend) with an edge crossing between them. Mirrors
  2-layout-dagre-subgraphs.mmd's structure exactly so the two only differ by
  layout engine, not by diagram shape. Composite/cross-boundary edges are a
  known-risky area for elk (see e2e/folder-based-screenshots.md), so this
  combination stays in the pr tier deliberately.
tags: [layout, elk, subgraphs]
