description: >
  Smoke test covering all 14 classic flowchart shapes in a single diagram,
  rendered under the default layout. Chained one-to-the-next rather than
  combined pairwise, so this stays a per-shape smoke test rather than a
  combinatorial one.
tags: [shapes, smoke, layout-default]
coveredShapes:
  - rectangle
  - rounded
  - stadium
  - subroutine
  - cylinder
  - circle
  - asymmetric
  - rhombus
  - hexagon
  - parallelogram
  - parallelogram-alt
  - trapezoid
  - trapezoid-alt
  - double-circle
